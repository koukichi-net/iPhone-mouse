name: HIDProbe
options:
  bundleIdPrefix: dev.koukichi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
targets:
  HIDProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: HIDProbe
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSBluetoothAlwaysUsageDescription: "HIDProbe tests whether this iPhone can publish Bluetooth LE services (spike)."
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-peripheral
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koukichi.hidprobe
        SWIFT_OBJC_BRIDGING_HEADER: Sources/HIDProbe-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
