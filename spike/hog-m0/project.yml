name: HOGM0
options:
  bundleIdPrefix: dev.koukichi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
targets:
  HOGM0:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: HOG-M0
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSBluetoothAlwaysUsageDescription: "HOG-M0 publishes a Bluetooth LE HID service to measure how computers bind to it (milestone 0 probe)."
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-peripheral
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koukichi.hogm0
        SWIFT_OBJC_BRIDGING_HEADER: Sources/HOGM0-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
